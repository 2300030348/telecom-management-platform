server:
  port: ${PORT:8082}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:mysql}

  sql:
    init:
      mode: always # Force data.sql to run on external databases like MySQL
      continue-on-error: true # Ignore errors (e.g. duplicate key errors) on restart if data is already seeded

  jpa:
    open-in-view: false
    defer-datasource-initialization: true # Defer data.sql execution until after Hibernate schema creation
    properties:
      hibernate:
        format_sql: true

# JWT Configuration settings - defined globally for all profiles
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 3600000 # 1 hour
  refreshExpirationMs: 86400000 # 24 hours

logging:
  level:
    org.springframework.security: DEBUG # Enable Spring Security Debug logs

---
spring:
  config:
    activate:
      on-profile: dev-h2
  datasource:
    url: jdbc:h2:mem:telecomdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    # Appended createDatabaseIfNotExist=true so that MySQL automatically creates the telecomdb schema if it is missing
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/telecomdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:Aa2.aaaa}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/telecomdb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
